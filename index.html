<script>

    const botoes = document.querySelectorAll("button");// cria uma variável chamada botão selecionando a tag "button"
    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);//verifica se o botão foi clicado
        function botaoClicado() {// cria uma função
            console.log("fui clicado");// mostra se o botão foi clicado
            let texto = document.querySelector("span");//cria uma  variavel chamada "texto" selecionando a tagb span
            texto.textContent++; //muda o valor do texto adicionando de uma unidade 
        }
    })
</script>
